name: Release Linux Build
permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验发布 tag 与 VERSION
        run: |
          version=$(tr -d '\r\n' < VERSION)
          expected_tag="v${version#v}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "发布 tag $GITHUB_REF_NAME 与 VERSION $expected_tag 不一致" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build Frontend
        run: bun install --frozen-lockfile && bun run build
        working-directory: ./frontend

      - name: Copy Frontend to Backend
        run: node scripts/copy-frontend.mjs

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod

      - name: Build Backend for amd64
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X main.GitCommit=${{ github.sha }}" -o api-proxy-linux-amd64 ./cmd/server
        working-directory: ./backend-go

      - name: Build Backend for arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -ldflags "-s -w -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X main.GitCommit=${{ github.sha }}" -o api-proxy-linux-arm64 ./cmd/server
        working-directory: ./backend-go

      - name: Release
        uses: softprops/action-gh-release@v2.0.5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            backend-go/api-proxy-linux-amd64
            backend-go/api-proxy-linux-arm64
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload embedding presets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 三个平台上传同一清单；同名 asset 的并发替换失败须有限重试。
          for attempt in 1 2 3 4; do
            if gh release upload "$GITHUB_REF_NAME" deploy/embedding-presets.json deploy/embedding-presets.schema.json --clobber; then
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              sleep "$((attempt * 2))"
            fi
          done
          echo "上传本地向量预设清单失败" >&2
          exit 1
